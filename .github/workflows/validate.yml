name: Validate preview
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.21.4
      - run: python -m unittest discover -s tests -p test_guides.py -q
      - run: python scripts/build_guides.py
      - run: python scripts/build_dashboard.py
      - run: python tests/check_package.py
      - run: python scripts/audit_public.py
