name: Validate preview
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_guides.py -q
      - run: python tests/test_household.py
      - run: python -m pytest -p pytest_asyncio.plugin tests/test_inventory.py -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python scripts/build_guides.py
      - run: python scripts/build_dashboard.py
      - run: python tests/check_package.py
      - run: node --check custom_components/kr_survival_kit/www/kr-survival-kit-card.js
      - run: node tests/test_warehouse_card.cjs
      - run: python tests/test_warehouse_visual.py
      - run: python scripts/audit_public.py
