get_inventory:
  name: Get inventory
  description: Return the local inventory snapshot, revision, and item statuses. Administrator only.
set_item:
  name: Set inventory item
  description: Replace one item's target and lots using the revision from get_inventory. Administrator only.
  fields:
    item_id:
      name: Item ID
      required: true
      example: drinking-water
    revision:
      name: Current revision
      required: true
      example: 0
    applicable:
      name: Applies to household
      required: true
      example: true
    target:
      name: Household target
      required: true
      example: 5000
    lots:
      name: Purchase lots
      description: List of lot_id, quantity, and expires_on (ISO date or null). Optional location is a storage place up to 60 characters, e.g. "주방 팬트리 3층 선반".
      required: true
      example: '[{"lot_id":"bottles-1","quantity":2000,"expires_on":"2027-02-01","location":"현관 팬트리"}]'
    confirm:
      name: Confirm physical inspection
      description: Set true only after checking the actual item and quantity.
      required: true
      example: false
    apply_date_defaults:
      name: 입고일과 포장 기한 확인일 적용
      description: 입고일이 비면 오늘로 저장합니다. 포장 기한이 비면 품목별 확인일을 저장합니다.
      example: true
    verified_on:
      name: Inspection date
      description: Optional past inspection date (YYYY-MM-DD) to keep when restoring a backup. Requires confirm; defaults to today.
      example: "2026-11-01"
delete_item:
  name: Delete inventory item
  description: Delete a household record using the current revision. Administrator only.
  fields:
    item_id:
      name: Item ID
      required: true
      example: drinking-water
    revision:
      name: Current revision
      required: true
      example: 1

set_household_size:
  name: 가구 인원 저장
  description: 3일 권장량을 계산할 가구 인원을 저장합니다.
  fields:
    household_size:
      name: 가구 인원
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box
    revision:
      name: 재고 revision
      required: true
      selector:
        number:
          min: 0
          max: 1000000000
          mode: box
    entry_id:
      name: 통합 항목 ID
      selector:
        text:

add_custom_item:
  name: Add custom item
  description: Add a household item that is not in the built-in catalog. Administrator only.
  fields:
    revision:
      name: Current revision
      required: true
      example: 3
    name:
      name: Item name
      description: 1-40 characters. The characters < > " ' ` & and backslash are not allowed.
      required: true
      example: 캠핑용 랜턴
    unit:
      name: Unit
      required: true
      example: 개
      selector:
        select:
          options: ["개", "병", "팩", "통", "박스", "세트", "켤레", "장", "롤", "kg"]
    date_kind:
      name: Date tracking
      description: expiry to record a use-by date, inspection for quantity checks only.
      required: true
      example: inspection
      selector:
        select:
          options: ["expiry", "inspection"]
    date_label:
      name: Date wording
      example: 사용기한
      selector:
        select:
          options: ["유통기한", "소비기한", "사용기한", "사용 권장기한"]

remove_custom_item:
  name: Remove custom item
  description: Delete a custom item and its stock record. Administrator only.
  fields:
    revision:
      name: Current revision
      required: true
      example: 4
    item_id:
      name: Custom item ID
      required: true
      example: custom-1
set_display:
  name: Set dashboard display
  description: Change the dashboard title, household nickname and which panels are shown. Only the fields you pass change. Administrator only.
  fields:
    revision:
      name: Current revision
      required: true
      example: 0
    title:
      name: Dashboard title
      description: Up to 30 characters without markup characters. Empty restores the default title.
      example: 우리 집 비축 관리
    nickname:
      name: Household nickname
      description: Up to 20 characters without markup characters. Empty hides it.
      example: 행복한 우리집
    show_survival:
      name: Show water and food days
      example: true
    show_clock:
      name: Show clock and weather
      example: true
    show_rank:
      name: Show shelter rank
      example: true
    show_missions:
      name: Show quests
      example: true
    show_expiring:
      name: Show expiring banner
      example: true
    entry_id:
      name: Config entry
      example: 0123456789abcdef
set_inspection_days:
  name: Set default inspection interval
  description: Change how many days after the last check an item is marked as needing a check (7-365). Administrator only.
  fields:
    inspection_days:
      name: Days
      required: true
      example: 90
    entry_id:
      name: Config entry
      example: 0123456789abcdef
