blueprint:
  name: KR Survival Kit - 주간 순환 소비 및 부족 알림
  description: >
    매주 지정한 요일과 시각에 기한 임박, 부족, 실사 필요 품목이 있으면 모바일 앱으로 알림을 보냅니다.
    아래 세 센서는 KR Survival Kit가 만든 센서만 목록에 나오며, 센서 이름이나 ID를 바꿔도 다시 고르면 계속 동작합니다.
  domain: automation
  source_url: https://github.com/redchupa/kr_survival_kit/blob/main/custom_components/kr_survival_kit/blueprints/automation/weekly_rotation_alert.yaml
  input:
    expiring_sensor:
      name: 기한 임박 품목 센서
      description: KR Survival Kit의 '기한 임박 품목' 센서를 고르세요.
      default: sensor.kr_survival_kit_expiring_count
      selector:
        entity:
          filter:
            - integration: kr_survival_kit
              domain: sensor
    shortage_sensor:
      name: 부족한 품목 센서
      description: KR Survival Kit의 '부족한 품목' 센서를 고르세요.
      default: sensor.kr_survival_kit_shortage_count
      selector:
        entity:
          filter:
            - integration: kr_survival_kit
              domain: sensor
    needs_check_sensor:
      name: 확인할 품목 센서
      description: KR Survival Kit의 '확인할 품목' 센서를 고르세요.
      default: sensor.kr_survival_kit_needs_check_count
      selector:
        entity:
          filter:
            - integration: kr_survival_kit
              domain: sensor
    notify_device:
      name: 알림을 받을 기기 (모바일 앱)
      description: Home Assistant Companion App이 설치된 스마트폰을 선택하세요.
      selector:
        device:
          filter:
            - integration: mobile_app
    weekday:
      name: 알림 요일
      default: "sun"
      selector:
        select:
          options:
            - label: 일요일
              value: "sun"
            - label: 토요일
              value: "sat"
            - label: 수요일
              value: "wed"
            - label: 월요일
              value: "mon"
    check_time:
      name: 확인 시각
      default: "10:00:00"
      selector:
        time: {}

mode: single

variables:
  expiring_sensor: !input expiring_sensor
  shortage_sensor: !input shortage_sensor
  needs_check_sensor: !input needs_check_sensor
  expiring: "{{ states(expiring_sensor) | int(0) }}"
  shortage: "{{ states(shortage_sensor) | int(0) }}"
  needs_check: "{{ states(needs_check_sensor) | int(0) }}"

triggers:
  - trigger: time
    at: !input check_time

conditions:
  - condition: time
    weekday:
      - !input weekday
  - condition: template
    value_template: "{{ expiring > 0 or shortage > 0 or needs_check > 0 }}"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "KR Survival Kit 주간 비축 점검"
    message: >
      기한 임박 {{ expiring }}종 · 부족 {{ shortage }}종 · 실사 필요 {{ needs_check }}종이 있습니다.
      대시보드에서 확인하고 먼저 소비·보충해 보세요!
    data:
      url: "/kr-survival-kit"
